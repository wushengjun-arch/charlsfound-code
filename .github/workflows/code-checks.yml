name: Code checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install black==26.10.1 build wheel setuptools
      - run: python -m black --check charls_found
      - run: python -m compileall -q charls_found
      - run: python -m build --wheel --no-isolation
